<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBuddy – AI Workout Generator</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="fitness-bg">
<main class="container narrow">
<section class="hero">
<div class="brand-mark">🏋️</div>
<p class="eyebrow">AI FITNESS PLANNER</p>
<h1>FitBuddy</h1>
<p class="subtitle">Your personalized 7-day workout plan, powered by Gemini.</p>
</section>

<section class="card">
<form action="/generate-workout" method="post" class="form-grid">
<label>Name<input name="name" type="text" maxlength="120" required placeholder="Your name"></label>
<label>User ID<input name="user_id" type="text" maxlength="100" required placeholder="e.g. user001"></label>
<div class="two-col">
<label>Age<input name="age" type="number" min="13" max="100" required></label>
<label>Weight (kg)<input name="weight" type="number" min="20" max="500" step="0.1" required></label>
</div>
<label>Fitness Goal
<select name="goal" required>
<option value="weight loss">Weight loss</option>
<option value="muscle gain">Muscle gain</option>
<option value="general wellness">General wellness</option>
<option value="flexibility">Flexibility</option>
<option value="cardio fitness">Cardio fitness</option>
</select>
</label>
<label>Workout Intensity
<select name="intensity" required>
<option value="low">Low</option>
<option value="medium" selected>Medium</option>
<option value="high">High</option>
</select>
</label>
<button class="primary-btn" type="submit">✨ Generate My Plan</button>
</form>
</section>

<div class="notice">
<strong>Note:</strong> FitBuddy provides general fitness information, not medical diagnosis or treatment.
Adjust activity to your abilities and seek professional advice when appropriate.
</div>

<footer><a href="/view-all-users">Admin / Coach Dashboard</a><span>•</span><a href="/docs">API Docs</a></footer>
</main>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
